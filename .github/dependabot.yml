version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 2
    open-pull-requests-limit: 10
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
    ignore:
      # vite and @vitejs/plugin-react have to cross majors together: plugin-react
      # 6.x requires vite ^8.0.0, while vite 8 is currently blocked because
      # @tailwindcss/vite 4.1.x peers on vite ^5.2 || ^6 || ^7 and vitest 3.x
      # depends on vite ^5 || ^6 || ^7. Ignore both majors until that whole
      # toolchain can move to vite 8 in a single change.
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
      - dependency-name: "vite"
        update-types:
          - version-update:semver-major
